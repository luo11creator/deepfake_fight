plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.deepfake_fight'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.deepfake_fight"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    // 确保 PyTorch 原生库打包进 APK
    packagingOptions {
        pickFirst '**/*.so'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 使用debug签名（临时方案，仅供测试分发）
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.1'
    implementation 'androidx.navigation:navigation-fragment:2.5.2'
    implementation 'androidx.navigation:navigation-ui:2.5.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // CameraX
    def camerax_version = "1.2.3"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ML Kit 人脸检测 (内置TFLite模型，离线可用)
    implementation 'com.google.mlkit:face-detection:16.1.6'

    // Guava (CameraX ListenableFuture依赖)
    implementation 'com.google.guava:guava:31.1-android'

    // OkHttp - 网络请求
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

    // Room 数据库 (检测历史记录)
    def room_version = "2.5.2"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // PyTorch Mobile - 本地AI推理（离线检测）
    // 用完整版而非 lite，确保原生 .so 库正确打包
    implementation 'org.pytorch:pytorch_android:1.12.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}